name: Generate Metrics

on:
  schedule:
    - cron: "0 6 * * 1"  # Every Monday at 6am
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest

    steps:
      # ── Isometric calendar + Language breakdown ──────────────────────────────
      - name: Full profile metrics
        uses: lowlighter/metrics@latest
        with:
          filename: assets/metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: mburgc
          template: classic
          base: ""
          config_timezone: America/Mexico_City
          config_display: large

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8



      # ── Chess board ─────────────────────────────────────────────────────────
      # Requires:
      #   1. A Lichess account (free) at https://lichess.org/
      #   2. A Lichess PAT at https://lichess.org/account/oauth/token
      #      (scope: none required for public games)
      #   3. Add the token as a repository secret named CHESS_TOKEN
      #   4. Set plugin_chess_user to your Lichess username below
      #   Then uncomment this entire step.
      #
      # - name: Chess board
      #   uses: lowlighter/metrics@latest
      #   with:
      #     filename: assets/metrics-chess.svg
      #     token: ${{ secrets.METRICS_TOKEN }}
      #     user: mburgc
      #     base: ""
      #     plugin_chess: yes
      #     plugin_chess_token: ${{ secrets.CHESS_TOKEN }}
      #     plugin_chess_user: your-lichess-username
      #     plugin_chess_platform: lichess

      # ── Commit generated SVGs ───────────────────────────────────────────────
      - name: Commit & Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add assets/metrics.svg assets/metrics-chess.svg 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update metrics [ci skip]"
            git push origin main
          fi
